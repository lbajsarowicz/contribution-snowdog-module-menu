name: Magento Check

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: magento-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Version matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      php: ${{ steps.matrix.outputs.php }}
    steps:
      - id: matrix
        uses: lbajsarowicz/github-action-magento-matrix@d5dc67ff01e74abf6588c8f8f265580d6b601eef # v0.1.0-rc.4

  static:
    name: "Static checks @ PHP ${{ matrix.php }}"
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.matrix.outputs.php) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: lbajsarowicz/github-action-magento-extension/static@c6b3b440a050a2320ddf13ad0599658448b4c55a # v0.1.0-rc.11
        with:
          php-version: ${{ matrix.php }}
          checks: validate,lint

  phpcs:
    name: "PHPCS: Magento ${{ matrix.magento }} @ PHP ${{ matrix.php }}"
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        uses: lbajsarowicz/github-action-magento-extension/phpcs@c6b3b440a050a2320ddf13ad0599658448b4c55a # v0.1.0-rc.11
        with:
          magento-version: ${{ matrix.magento }}
          php-version: ${{ matrix.php }}
          annotations: ${{ strategy.job-index == 0 }}

  phpstan:
    name: "PHPStan: Magento ${{ matrix.magento }} @ PHP ${{ matrix.php }}"
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        uses: lbajsarowicz/github-action-magento-extension/phpstan@c6b3b440a050a2320ddf13ad0599658448b4c55a # v0.1.0-rc.11
        with:
          magento-version: ${{ matrix.magento }}
          php-version: ${{ matrix.php }}
          annotations: ${{ strategy.job-index == 0 }}
      - name: Upload results
        if: ${{ always() && steps.check.outputs.result-path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: phpstan-${{ matrix.magento }}-php${{ matrix.php }}
          path: ${{ steps.check.outputs.result-path }}
          retention-days: 7

  compile:
    name: "Compile: Magento ${{ matrix.magento }} @ PHP ${{ matrix.php }}"
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        uses: lbajsarowicz/github-action-magento-extension/compile@c6b3b440a050a2320ddf13ad0599658448b4c55a # v0.1.0-rc.11
        with:
          magento-version: ${{ matrix.magento }}
          php-version: ${{ matrix.php }}
      - name: Upload results
        if: ${{ always() && steps.check.outputs.result-path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: compile-${{ matrix.magento }}-php${{ matrix.php }}
          path: ${{ steps.check.outputs.result-path }}
          retention-days: 7

  unit:
    name: "Unit tests: Magento ${{ matrix.magento }} @ PHP ${{ matrix.php }}"
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        uses: lbajsarowicz/github-action-magento-extension/phpunit@c6b3b440a050a2320ddf13ad0599658448b4c55a # v0.1.0-rc.11
        with:
          magento-version: ${{ matrix.magento }}
          php-version: ${{ matrix.php }}
          suite: unit
      - name: Upload results
        if: ${{ always() && steps.check.outputs.result-path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-${{ matrix.magento }}-php${{ matrix.php }}
          path: ${{ steps.check.outputs.result-path }}
          retention-days: 7
