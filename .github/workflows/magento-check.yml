name: Magento Check

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: magento-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Version matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      php: ${{ steps.matrix.outputs.php }}
    steps:
      - id: matrix
        uses: lbajsarowicz/github-action-magento-matrix@8127c452119ddebdb9bcf5c9002806cdbce73996 # v0.1.0-rc.3

  static:
    name: Static checks / PHP ${{ matrix.php }}
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.matrix.outputs.php) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: lbajsarowicz/github-action-magento-extension/static@387fd4c9011b2eccf7f01f3a6975641fb7c88aad # v0.1.0-rc.6
        with:
          php-version: ${{ matrix.php }}
          checks: validate,lint

  magento:
    name: Magento ${{ matrix.magento }} / PHP ${{ matrix.php }}
    needs: matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        uses: lbajsarowicz/github-action-magento-extension@387fd4c9011b2eccf7f01f3a6975641fb7c88aad # v0.1.0-rc.6
        with:
          magento-version: ${{ matrix.magento }}
          php-version: ${{ matrix.php }}
          checks: install,phpcs,compile,unit,phpstan
          annotations: ${{ strategy.job-index == 0 }}
      - name: Upload results
        if: ${{ always() && steps.check.outputs.result-path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: magento-check-${{ matrix.magento }}-php${{ matrix.php }}
          path: ${{ steps.check.outputs.result-path }}
          retention-days: 7
